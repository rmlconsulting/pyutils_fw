name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          # macos-latest runners are arm64 and have no CPython 3.9 build;
          # the include below covers 3.9 on Intel macOS instead
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: macos-13
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[process]" pytest
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
      - name: Wheel carries the package and its data
        run: |
          unzip -l dist/*.whl | grep "pyutils_fw/__init__.py"
          unzip -l dist/*.whl | grep "power_on.jlink"
          if unzip -l dist/*.whl | grep -i "\.jpeg"; then
            echo "JPEGs must not ship in the wheel"
            exit 1
          fi
