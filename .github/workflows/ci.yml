name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          # no hosted runner can execute CPython 3.9 on macOS: setup-python
          # only ships darwin-x64 builds of 3.9 (never arm64), today's
          # macos-* runners are all arm64, and the last Intel runner
          # (macos-13) is retired. The 3.9 floor is proven on Linux and
          # Windows here, and macOS itself runs 3.12.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[process]" pytest
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
      - name: Wheel carries the package and its data
        run: |
          unzip -l dist/*.whl | grep "pyutils_fw/__init__.py"
          unzip -l dist/*.whl | grep "power_on.jlink"
          if unzip -l dist/*.whl | grep -i "\.jpeg"; then
            echo "JPEGs must not ship in the wheel"
            exit 1
          fi
